# What `src/nifler/nim.cfg` gives `bin/nifler`, for a driver that lives
# elsewhere: nifler parses Nim with the host compiler's own front end, so the
# Nim installation and its `compiler/` directory have to be on the search path
# (`compiler / syntaxes` imports its siblings unqualified). `-d:nimcore` is
# what those modules expect from an embedder. The pinned parser swap-in lives
# in `config.nims` next door, because only NimScript can `patchFile`.
--path: "$nim"
--path: "$nim/compiler"
--define: nimcore
