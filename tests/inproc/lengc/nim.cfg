# `setup.nim` imports the lengc backend directly, so it needs the two switches
# `src/lengc/nim.cfg` gives the tool itself — that file is only read when the
# project lives in `src/lengc/`, and here the project is this runner.
#
# `--experimental:strictdefs` is not optional: `codegen.nim` declares
# `let name: string` and assigns it in branches, which only compiles under it.
--experimental:strictdefs
--define:showBroken
--styleCheck: off
